name: GrokShellWidgets
options:
  bundleIdPrefix: dev.grokshell
  createIntermediateGroups: true

targets:
  # The container app — exists only to carry the widget extension into the
  # system. Install it once, run it once, and the widgets register with
  # Notification Center.
  GrokShellHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [GrokShellHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.grokshell.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grok Shell Widgets
        INFOPLIST_KEY_LSUIElement: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: GrokShellWidget
        embed: true

  # The actual WidgetKit extension — a sandboxed appex whose UI is SwiftUI.
  # It polls the app-server's /data API; generated TSX never runs here.
  GrokShellWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources: [GrokShellWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.grokshell.host.widget
        PRODUCT_BUNDLE_PACKAGE_TYPE: XPC!
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GrokShellWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: GrokShellWidget/GrokShellWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        SKIP_INSTALL: YES
