name: GenUIWidgets
options:
  bundleIdPrefix: dev.genui
  createIntermediateGroups: true

targets:
  # The container app — exists only to carry the widget extension into the
  # system. Install it once, run it once, and the widgets register with
  # Notification Center.
  GenUIHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [GenUIHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.genui.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gen UI Widgets
        INFOPLIST_KEY_LSUIElement: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: GenUIWidget
        embed: true

  # The actual WidgetKit extension — a sandboxed appex whose UI is SwiftUI.
  # It polls the gen-server's /data API; generated TSX never runs here.
  GenUIWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources: [GenUIWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.genui.host.widget
        PRODUCT_BUNDLE_PACKAGE_TYPE: XPC!
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GenUIWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: GenUIWidget/GenUIWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        SKIP_INSTALL: YES
