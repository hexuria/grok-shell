<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Connect Apps modal — before / after</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'SF Pro Text',system-ui,sans-serif; }
  body { background:#3a3a3c; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 0 60px;
         user-select:none; }
  body.light { background:#b9b9be; }

  .toolbar { display:flex; gap:14px; align-items:center; margin-bottom:14px; }
  .seg { display:flex; background:rgba(255,255,255,.12); border-radius:9px; padding:3px; }
  body.light .seg { background:rgba(0,0,0,.10); }
  .seg button { border:0; background:transparent; color:rgba(255,255,255,.75); font-size:13px; font-weight:600;
                padding:6px 16px; border-radius:7px; cursor:pointer; }
  body.light .seg button { color:rgba(0,0,0,.6); }
  .seg button.on { background:#fff; color:#000; }
  body.light .seg button.on { background:#fff; color:#000; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .chk { color:rgba(255,255,255,.75); font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; }
  body.light .chk { color:rgba(0,0,0,.65); }

  .legend { color:rgba(255,255,255,.65); font-size:12px; max-width:800px; margin-bottom:18px; line-height:1.7; }
  body.light .legend { color:rgba(0,0,0,.6); }
  .legend b { color:#ff9f9f; font-weight:600; }

  /* ============ MODAL ============ */
  .modal { position:relative; width:800px; height:660px; border-radius:14px; overflow:hidden;
           box-shadow:0 24px 80px rgba(0,0,0,.45), 0 0 0 .5px rgba(0,0,0,.15);
           --card:#1f1f1f; --ink:#f5f5f5; --dim:rgba(245,245,245,.55); --line:rgba(255,255,255,.09);
           --pill:rgba(255,255,255,.06); --wash:rgba(255,255,255,.045); --pillRow:rgba(255,255,255,.10);
           --pillBtn:rgba(255,255,255,.17); --field:rgba(255,255,255,.05); --green:#4ade80; }
  .modal.light { --card:#ffffff; --ink:#1d1d1f; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.09);
           --pill:rgba(0,0,0,.045); --wash:rgba(0,0,0,.035); --pillRow:rgba(0,0,0,.075);
           --pillBtn:rgba(0,0,0,.12); --field:rgba(0,0,0,.045); --green:#16a34a; }
  .modal { background:var(--card); color:var(--ink); }

  /* margin guides */
  .guide { position:absolute; top:0; bottom:0; width:0; border-left:1.5px dashed #ff3b30; z-index:40; display:none; pointer-events:none; }
  .modal.guides .guide { display:block; }

  /* ============ close button ============ */
  .xbtn { position:absolute; top:18px; width:28px; height:28px; border-radius:14px; z-index:30;
          display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .xbtn:hover { background:var(--wash); }
  .xbtn svg { width:15px; height:15px; fill:var(--dim); }
  .modal.before .xbtn { right:4px; }           /* current: shares the title's band, in the gutter */
  /* AFTER: 32px circle — same height as search + Bot templates — centered in the fixed 42px top band.
     It never moves. */
  /* left edge = Bot templates' right edge (67px from card edge) + the same 8px gap as search↔templates */
  .modal.after .xbtn { right:27px; top:5px; width:32px; height:32px; border-radius:16px; }
  .modal.after .xbtn svg { width:15px; height:15px; }
  /* AFTER: pinned search row TELEPORTS into the empty band next to the ✕ (no sticky slide) */
  .pinBar { display:none; }
  .modal.after .pinBar { display:block; position:absolute; top:5px; left:33px; right:33px; height:32px; z-index:25; }
  .modal.after .pinBar .searchRow { height:32px; }
  .modal.after.pinned .xrow { box-shadow:0 1px 0 var(--line); }
  /* AFTER: the ✕'s own line is a fixed band above the scroll */
  .xrow { display:none; }
  .modal { display:flex; flex-direction:column; }
  .modal.after .xrow { display:block; position:absolute; top:0; left:0; right:0; height:42px; z-index:20; pointer-events:none; }
  .modal.after.pinned .xrow { background:var(--card); }
  .modal.after .scroll { position:relative; inset:auto; flex:1; }
  .modal.after .drop { top:140px; }           /* under the search row: xrow 46 + title 44 + search ~54 */
  .modal.after .xbtn { z-index:30; }          /* ✕ floats above the pinned search band */

  /* ============ header (BEFORE: fixed, collapses on scroll) ============ */
  .headBox { padding:0 33px; flex:none; }
  .titleRow { height:44px; display:flex; align-items:center; overflow:hidden; }
  .titleRow h1 { font-size:17px; font-weight:600; letter-spacing:-.2px; flex:1; white-space:nowrap; }
  .searchRow { display:flex; gap:8px; align-items:center; height:48px; }
  .modal.before .searchRow { padding-bottom:4px; }

  .connChip { display:flex; align-items:center; gap:7px; height:30px; padding:0 10px 0 6px; border-radius:15px;
              background:var(--pill); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .connChip .stack { display:flex; align-items:center; }
  .connChip .cv { font-size:11px; color:var(--dim); }
  .chipTile { width:18px; height:18px; border-radius:5px; margin-left:-7px; border:2px solid var(--card);
              display:flex; align-items:center; justify-content:center; }
  .chipTile:first-child { margin-left:0; }
  .chipTile svg { width:11px; height:11px; }

  .searchField { flex:1; height:36px; border-radius:18px; background:var(--field); border:1px solid var(--line);
                 display:flex; align-items:center; gap:9px; padding:0 14px; }
  .searchField svg { width:14px; height:14px; fill:var(--dim); flex:none; }
  .searchField input { border:0; background:transparent; outline:none; color:var(--ink); font-size:13px; width:100%; }
  .searchField input::placeholder { color:var(--dim); }

  .tplBtn { height:32px; border-radius:16px; border:1px solid var(--line); background:transparent; color:var(--ink);
            display:flex; align-items:center; gap:7px; padding:0 13px; font-size:13px; font-weight:500;
            cursor:pointer; white-space:nowrap; }
  .tplBtn svg { width:14px; height:14px; }
  /* BUG (before + light): bot glyph keeps dark-theme ink -> invisible on white */
  .modal.before.light .tplBtn .botIco { fill:#f5f5f5; }
  .tplBtn .botIco { fill:var(--ink); }
  .tplBtn .arrow { fill:none; stroke:var(--dim); stroke-width:2; }

  /* header buttons: AFTER mode ends just inside the guide line */
  .modal.after .headItem { padding-right:34px; }

  /* ============ pills ============ */
  .pillsRow { display:flex; gap:8px; align-items:center; padding:12px 0 12px; background:var(--card); }
  /* BEFORE: pills overflow past the right margin into the gutter zone */
  .modal.after .pillsRow { overflow:hidden; }
  .morePill { display:none; }
  .modal.after .morePill { display:flex; }
  /* AFTER: cap the visible categories, Grok-style More covers the rest */
  .modal.after .pill.off:nth-child(n+6):not(.morePill) { display:none; }
  .modal.after .searchRow { height:44px; }
  /* AFTER: right content margin moves in to 48px — View all, Add pills, cards follow it.
     Header rows compensate (48 + 19 = 67) so search / Bot templates / ✕ stay put. */
  .modal.after .scrollInner { padding-right:48px; }
  .modal.after .scrollInner > .headItem { padding-right:19px; }
  .modal.after .gR { right:48px !important; }
  /* AFTER: search, Bot templates and ✕ share one height — 32px */
  .modal.after .searchField { height:32px; border-radius:16px; }
  .modal.after .tplBtn { height:32px; border-radius:16px; }
  .modal.after .pill { height:26px; padding:0 12px; border-radius:13px; font-size:12px; }
  /* pills are NOT pinned — they scroll away with the content */
  .pill { height:28px; padding:0 13px; border-radius:14px; border:0; font-size:12.5px; font-weight:500;
          display:flex; align-items:center; cursor:pointer; white-space:nowrap; }
  .pill.on { background:var(--ink); color:var(--card); }
  .pill.off { background:var(--pill); color:var(--ink); }
  .pill.off:hover { background:var(--pillRow); }

  /* ============ scroll region ============ */
  .scroll { position:absolute; inset:0; overflow-y:auto; overscroll-behavior:none; } /* no rubber-band bounce */
  .scrollInner { padding:0 33px 30px; }
  .modal.before .scrollInner { padding-top:0; }

  /* BEFORE: fixed head + scroll below */
  .modal.before .scroll { top:0; }
  .modal.before .headBox { position:relative; z-index:20; background:var(--card); padding-top:14px; }
  .modal.before .scrollInner > .pillsRow { padding-top:10px; }

  /* BEFORE: headBox floats above, scroll starts beneath it */
  .modal.before { display:flex; flex-direction:column; }
  .modal.before .scroll { position:relative; inset:auto; flex:1; }

  /* AFTER: single scroll, head scrolls away */
  .modal.after .headBox { display:none; }
  .modal.after .scrollInner > .titleRow { margin-top:0; height:42px; }   /* sits ON the ✕'s line — no wasted strip */

  .secHead { display:flex; align-items:baseline; padding:22px 0 4px; }
  .secHead h2 { font-size:13px; font-weight:600; flex:1; }
  .secHead a { font-size:12px; color:var(--dim); cursor:pointer; }
  .secHead a:hover { color:var(--ink); }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { display:flex; align-items:center; gap:12px; height:72px; padding:0 12px; border-radius:16px;
          cursor:default; min-width:0; }        /* keep the grid cell from being blown out by long text */
  .grid > .card:nth-child(odd)  { margin-left:-12px; }
  .grid > .card:nth-child(even) { margin-right:-12px; }
  .card:hover { background:var(--wash); }

  .tile { width:38px; height:38px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; }
  .tile.brand { background:#fff; }
  .modal.light .tile.brand { border:1px solid rgba(0,0,0,.08); }
  .tile.letter { font-size:17px; font-weight:700; color:#fff; }
  .tile svg { width:20px; height:20px; }

  .meta { flex:1; min-width:0; }
  .meta .nm { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta .ds { font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  .add { height:30px; min-width:56px; padding:0 14px; border-radius:15px; border:0; font-size:13px; font-weight:500;
         background:var(--pill); color:var(--ink); cursor:pointer; flex:none; }
  .added { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--green); font-weight:500; flex:none;
           padding-right:6px; }
  .added svg { width:13px; height:13px; fill:none; stroke:var(--green); stroke-width:2.4; }

  /* AFTER: card box stays inside the margin guides — tiles/Add sit ON the margin */
  .modal.after .grid > .card { margin-left:0; margin-right:0; padding:0; }
  .modal.after .add { padding:0 22px; }        /* bigger Add pill */
  .modal.after .meta { max-width:200px; }      /* trim descriptions — leave a gap before the Add pill */
  .modal.after .card .add, .modal.after .card .added { margin-left:auto; }  /* Add stays pinned to the margin */

  /* ---- hover tiers ---- */
  /* BEFORE: one tier — row hover and button hover look identical */
  .modal.before .card:hover .add,
  .modal.before .card .add:hover { background:var(--pillRow); }
  /* AFTER: row hover lifts the pill slightly; hovering the pill itself steps darker */
  .modal.after .card:hover .add { background:var(--pillRow); }
  .modal.after .card .add:hover { background:var(--pillBtn); }

  .hint { font-size:12px; color:rgba(255,255,255,.5); margin-top:14px; }
  body.light .hint { color:rgba(0,0,0,.5); }

  /* ============ search dropdown ============ */
  .drop { position:absolute; top:100px; z-index:35; border-radius:12px; border:1px solid var(--line);
          background:var(--card); box-shadow:0 16px 48px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.18);
          overflow-y:auto; overflow-x:hidden; display:none; max-height:330px; }  /* scrolls internally */
  .modal.after  .drop { left:63px; right:63px; }      /* Grok: indented under the field, ends at margin */
  .modal.before .drop { left:20px; right:33px; }      /* ours: overshoots the field's left edge */
  /* BUG (before + light): translucent bg + dark-theme ink -> unreadable */
  .modal.before.light .drop { background:rgba(255,255,255,.55); backdrop-filter:blur(10px);
          border-color:transparent; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .modal.before.light .drop .nm { color:#f5f5f5; }
  .modal.before.light .drop .dtitle { color:rgba(245,245,245,.55); }
  .dtitle { font-size:11.5px; color:var(--dim); padding:12px 14px 6px; font-weight:500; }
  .drow { display:flex; align-items:center; gap:11px; height:44px; padding:0 14px; cursor:pointer; }
  .drow .mini { width:22px; height:22px; border-radius:6px; flex:none; display:flex; align-items:center;
                justify-content:center; background:#fff; }
  .drow .mini.letter { color:#fff; font-size:11px; font-weight:700; }
  .drow .mini svg { width:13px; height:13px; }
  .drow .nm { font-size:13px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .drow .gt { color:var(--dim); font-size:13px; }
  .modal.after .drow:hover, .modal.after .drow.sel { background:var(--wash); }
  .modal.after .drow.sel { box-shadow:inset 2px 0 0 var(--dim); }
  /* BEFORE: no hover state at all */
  .clr { font-size:12px; color:var(--dim); cursor:pointer; flex:none; display:none; padding:2px 4px; }
  .clr:hover { color:var(--ink); }
  .searchField.has .clr { display:block; }

  /* ============ sidebar toggle comparison ============ */
  .chrome { display:flex; align-items:center; gap:16px; margin-bottom:16px; padding:12px 20px;
            border-radius:12px; background:rgba(0,0,0,.25); }
  body.light .chrome { background:rgba(255,255,255,.45); }
  .chromeLabel { font-size:12px; color:rgba(255,255,255,.6); }
  body.light .chromeLabel { color:rgba(0,0,0,.55); }
  .chromeBox { display:flex; align-items:center; gap:10px; }
  .chromeBtn { width:34px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center;
               background:rgba(255,255,255,.08); }
  body.light .chromeBtn { background:rgba(0,0,0,.06); }
  .chromeBtn svg { width:18px; height:18px; color:rgba(255,255,255,.72); }
  body.light .chromeBtn svg { color:rgba(0,0,0,.65); }
  .cap { font-size:11.5px; color:rgba(255,255,255,.5); }
  body.light .cap { color:rgba(0,0,0,.5); }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="seg" id="segMode">
      <button data-m="before" class="on">Before (ours)</button>
      <button data-m="after">After (Grok)</button>
    </div>
    <div class="seg" id="segTheme">
      <button data-t="light">Light</button>
      <button data-t="dark" class="on">Dark</button>
    </div>
    <label class="chk"><input type="checkbox" id="guides"> margin guides</label>
  </div>
  <div class="legend" id="legend"></div>

  <!-- sidebar toggle icon: current floating-tab glyph vs ChatGPT's stroked panel-left -->
  <div class="chrome" id="chrome">
    <span class="chromeLabel">sidebar toggle</span>
    <div class="chromeBox"><div class="chromeBtn" id="btnCurrent"></div><span class="cap">current (floating tab)</span></div>
    <span class="chromeLabel">→</span>
    <div class="chromeBox"><div class="chromeBtn" id="btnChatGpt"></div><span class="cap">ChatGPT (panel-left)</span></div>
  </div>

  <div class="modal before dark guides-off" id="modal">
    <div class="guide" style="left:33px"></div>
    <div class="guide gR" style="right:33px"></div>
    <div class="guide" id="guideX" style="right:64px"></div>
    <div class="xrow"></div>
    <div class="pinBar" id="pinBar"></div>
    <div class="xbtn" title="Close">
      <svg viewBox="0 0 24 24"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3z"/></svg>
    </div>

    <div class="headBox">
      <div class="titleRow" id="titleRowB"><h1>Connect Apps</h1><div id="chipSlotB"></div></div>
      <div class="searchRow headItem" id="searchRowB"></div>
    </div>

    <div class="scroll" id="scrollEl">
      <div class="scrollInner" id="scrollInner">
        <div class="titleRow headItem" id="titleRowA" style="display:none"><h1>Connect Apps</h1><div id="chipSlotA"></div></div>
        <div class="searchRow headItem" id="searchRowA" style="display:none"></div>
        <div class="pillsRow" id="pillsRow"></div>
        <div id="sections"></div>
      </div>
    </div>
    <div class="drop" id="drop"><div class="dtitle">Plugins</div><div id="dlist"></div></div>
  </div>
  <div class="hint" id="badge"></div>

/* ---------- svg helpers ---------- */
const NS='http://www.w3.org/2000/svg';
function svg(d, fill, size, vb){ const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox', vb||'0 0 24 24'); s.setAttribute('width',size); s.setAttribute('height',size);
  const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); p.setAttribute('fill',fill);
  s.appendChild(p); return s; }

function tileEl(key){
  const b=brandOf(key);
  const t=document.createElement('div');
  if(b){ t.className='tile brand'; t.appendChild(svg(b.d,b.hex,21)); }
  else{ const L=LETTER[key]||['#555','?']; t.className='tile letter';
        t.style.background=L[0]; t.textContent=L[1]; }
  return t;
}
function luminance(hex){ const n=parseInt(hex.slice(1),16);
  return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255; }
function chipTile(key){
  const b=brandOf(key);
  const t=document.createElement('div'); t.className='chipTile';
  if(b){ t.style.background=b.hex; t.appendChild(svg(b.d, luminance(b.hex)>0.6?'#000':'#fff',11)); }
  else { const L=LETTER[key]||['#555','?']; t.style.background=L[0];
         t.innerHTML='<span style="font-size:9px;font-weight:700;color:#fff">'+L[1]+'</span>'; }
  return t;
}

const MAG='M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 20 9.5 4.5 4.5 0 0 1 15.5 14z';
const BOT='M12 2a1 1 0 0 1 1 1v1.1A6.5 6.5 0 0 1 18.5 10v7a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 5.5 17v-7A6.5 6.5 0 0 1 11 4.1V3a1 1 0 0 1 1-1zM8.5 11a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z';
const NE='M7 17 17 7M9 7h8v8';

function connChip(){
  const c=document.createElement('div'); c.className='connChip';
  const st=document.createElement('div'); st.className='stack';
  for(const k of ['clerk','chrome-devtools','vercel','supabase']) st.appendChild(chipTile(k));
  c.appendChild(st);
  c.insertAdjacentHTML('beforeend','<span>6 connected</span><span class="cv">›</span>');
  return c;
}
function searchRow(){
  const r=document.createElement('div'); r.className='searchRow headItem';
  const f=document.createElement('div'); f.className='searchField';
  f.appendChild(svg(MAG,'var(--dim)',14));
  const i=document.createElement('input'); i.placeholder='Search across apps and skills';
  i.className='srch';
  f.appendChild(i);
  const c=document.createElement('span'); c.className='clr'; c.textContent='Clear';
  c.onclick=ev=>{ ev.stopPropagation(); i.value=''; f.classList.remove('has'); hideDrop(); };
  f.appendChild(c);
  const b=document.createElement('button'); b.className='tplBtn';
  const bi=svg(BOT,'',14); bi.firstChild.setAttribute('class','botIco'); bi.classList.add('botIco');
  b.appendChild(bi); b.insertAdjacentHTML('beforeend','Bot templates');
  b.appendChild(svg(NE,'none',11)); b.lastChild.firstChild.setAttribute('stroke','var(--dim)');
  b.lastChild.firstChild.setAttribute('fill','none');
  r.appendChild(f); r.appendChild(b);
  return r;
}
function pillRow(){
  const r=document.createElement('div');
  ['All','Deployment','Monitoring','Development','Database','Observability','Productivity','Security']
    .forEach((n,i)=>{ const p=document.createElement('button');
      p.className='pill '+(i?'off':'on'); p.textContent=n; r.appendChild(p); });
  const m=document.createElement('button'); m.className='pill off morePill';
  m.textContent='More ⌄'; r.appendChild(m);
  return r;
}
function cardEl(it){
  const [key,name,desc,state]=it;
  const c=document.createElement('div'); c.className='card';
  c.appendChild(tileEl(key));
  const m=document.createElement('div'); m.className='meta';
  m.innerHTML='<div class="nm">'+name+'</div><div class="ds">'+desc+'</div>';
  c.appendChild(m);
  if(state==='added'){ const a=document.createElement('div'); a.className='added';
    a.innerHTML=CHECK+'Added'; c.appendChild(a); }
  else { const b=document.createElement('button'); b.className='add';
    b.textContent = state==='connect'?'Connect':'Add'; c.appendChild(b); }
  return c;
}

/* ---------- populate ---------- */
const modal=document.getElementById('modal');
const scrollInner=document.getElementById('scrollInner');
const scrollEl=document.getElementById('scrollEl');
const pillsRow=document.getElementById('pillsRow');
pillsRow.replaceChildren(...pillRow().childNodes);
document.getElementById('chipSlotB').replaceWith(connChip());
document.getElementById('chipSlotA').replaceWith(connChip());
const searchA=searchRow(), searchB=searchRow();
document.getElementById('searchRowA').replaceWith(searchA);
document.getElementById('searchRowB').replaceWith(searchB);

const sections=document.getElementById('sections');
for(const s of SECTIONS){
  const h=document.createElement('div'); h.className='secHead';
  h.innerHTML='<h2>'+s.name+'</h2>'+(s.viewAll?'<a>View all</a>':'');
  const g=document.createElement('div'); g.className='grid';
  for(const it of s.items) g.appendChild(cardEl(it));
  sections.appendChild(h); sections.appendChild(g);
}

/* ---------- search dropdown ---------- */
const DROWS = [
  ['chrome-devtools','Chrome DevTools for Agents'],
  ['chrome-devtools','Modern Web Guidance'],
  ['browseruse','Browser Use'],
  ['chainguard','Chainguard'],
  ['tuist','Tuist'],
  ['pascal','Pascal'],
  ['clerk','Clerk'],
  ['aws-agents','AWS Agents'],
  ['quo','Quo'],
  ['helena','Helena'],
  ['calcom','Calcom'],
];
Object.assign(LETTER, { browseruse:['#7c5c3f','B'], chainguard:['#7c3aed','C'], tuist:['#8b5cf6','T'],
  pascal:['#1f2937','P'], 'aws-agents':['#f5f5f5','aws'], quo:['#0ea5e9','Q'], helena:['#3b82f6','H'] });

/* ---------- sidebar toggle comparison ---------- */
(function(){
  const cur=document.getElementById('btnCurrent');
  const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 24 24');
  for(const d of SIDEBAR_CUR){ const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill','currentColor'); s.appendChild(p); }
  cur.appendChild(s);
  document.getElementById('btnChatGpt').innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/></svg>';
})();

const drop=document.getElementById('drop'), dlist=document.getElementById('dlist');
let selIdx=-1, dropItems=[];
function miniTile(key){
  const b=brandOf(key), t=document.createElement('div'); t.className='mini';
  if(b){ t.appendChild(svg(b.d,b.hex,13)); }
  else { const L=LETTER[key]||['#555','?']; t.classList.add('letter'); t.style.background=L[0];
         t.style.fontSize= L[1].length>1 ? '8px':'11px'; t.textContent=L[1]; }
  return t;
}
function markSel(){ [...dlist.children].forEach((r,i)=>r.classList.toggle('sel', mode==='after'&&i===selIdx));
  const s=dlist.children[selIdx]; if(mode==='after'&&s) s.scrollIntoView({block:'nearest'}); }
function renderDrop(q){
  dropItems = DROWS.filter(it=>!q || it[1].toLowerCase().includes(q.toLowerCase()));
  dlist.innerHTML='';
  dropItems.forEach((it,i)=>{
    const r=document.createElement('div'); r.className='drow';
    r.appendChild(miniTile(it[0]));
    r.insertAdjacentHTML('beforeend','<span class="nm">'+it[1]+'</span><span class="gt">›</span>');
    r.onmouseenter=()=>{ if(mode==='after'){ selIdx=i; markSel(); } };
    r.onclick=()=>choose(it);
    dlist.appendChild(r);
  });
  selIdx = mode==='after' && dropItems.length ? 0 : -1; markSel();
  placeDrop();
  drop.style.display = dropItems.length ? 'block' : 'none';
}
function placeDrop(){
  if(mode!=='after') return;
  const mr=modal.getBoundingClientRect(), fr=searchA.querySelector('.searchField').getBoundingClientRect();
  drop.style.left  = (fr.left   - mr.left)+'px';   /* same left edge as the field */
  drop.style.right = (mr.right  - fr.right)+'px';  /* same width/right edge */
  drop.style.top   = (fr.bottom - mr.top + 4)+'px';
}
function hideDrop(){ drop.style.display='none'; drop.style.left=drop.style.right=drop.style.top=''; selIdx=-1; }
function choose(it){
  document.querySelectorAll('.srch').forEach(inp=>{ inp.value=it[1]; inp.closest('.searchField').classList.add('has'); });
  hideDrop();
}
document.querySelectorAll('.srch').forEach(inp=>{
  inp.addEventListener('input', ()=>{
    inp.closest('.searchField').classList.toggle('has', !!inp.value);
    if(inp.value) renderDrop(inp.value); else hideDrop();
  });
  inp.addEventListener('keydown', e=>{
    if(drop.style.display!=='block' || mode!=='after') return;
    if(e.key==='ArrowDown'){ selIdx=Math.min(selIdx+1, dropItems.length-1); markSel(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ selIdx=Math.max(selIdx-1, 0); markSel(); e.preventDefault(); }
    else if(e.key==='Enter' && dropItems[selIdx]) choose(dropItems[selIdx]);
    else if(e.key==='Escape') hideDrop();
  });
});

/* ---------- mode wiring ---------- */
const titleRowB=document.getElementById('titleRowB');
const chipA=document.getElementById('chipSlotA'), chipB=document.getElementById('chipSlotB');
let mode='before';

const LEGEND = {
  before:`<b>BEFORE — current Grok Shell:</b> scrolling collapses the "Connect Apps" row (it gets visibly
          clipped mid-scroll) while the search row stays pinned and the category pills scroll away.
          The ✕ hugs the corner (4px) so header buttons crowd it. Hovering a card row vs its Add button
          looks identical — one hover tier. Type in the search field: the results list overshoots the
          field's left edge, rows have no hover, ↑/↓ do nothing. In light theme the Bot templates glyph
          keeps dark-theme ink (invisible) and the dropdown goes translucent/unreadable.
          The strip above compares the sidebar toggle: our floating-tab glyph vs ChatGPT's
          stroked panel-left — the swap is part of the fix set.`,
  after:`<b>AFTER — Grok behavior:</b> the ✕ owns a fixed top band and never moves. Scroll down: the
          title and pills scroll away, and the moment the search row reaches the top it jumps straight
          into the empty band next to the ✕ — no sticky slide, no animation, no bounce (overscroll off).
          Search field, Bot templates and the ✕ hover circle all share one 32px height. Bot templates
          ends inside the margin, clear of the ✕ column. Cards stay inside the guides; Add pills get
          22px side padding. Two hover tiers: row hover lifts the pill lightly, hovering the pill itself
          steps darker. Type in search: the combo box matches the field's width, scrolls internally,
          rows highlight on hover, and ↑/↓ + Enter + Esc work. Everything re-tints in light theme.`};

function setMode(m){
  if(typeof setPinned==='function') setPinned(false);
  mode=m;
  hideDrop();
  modal.classList.toggle('before', m==='before');
  modal.classList.toggle('after', m==='after');
  const inScroll = m==='after';
  const titleEl = document.querySelector(m==='after' ? '#titleRowA' : '#titleRowB');
  const searchEl = m==='after' ? searchA : searchB;
  if(inScroll){
    titleEl.style.display='flex'; searchEl.style.display='flex';
    scrollInner.insertBefore(searchEl, pillsRow);
    scrollInner.insertBefore(titleEl, searchEl);
    titleEl.style.marginTop='';
    document.querySelector('.headBox').style.display='none';
  } else {
    document.querySelector('.headBox').style.display='';
    titleEl.style.display=''; searchEl.style.display='';
    document.getElementById('titleRowA').style.display='none'; searchA.style.display='none';
    const hb=document.querySelector('.headBox');
    hb.appendChild(titleEl); hb.appendChild(searchEl);
    hb.insertBefore(titleEl, hb.firstChild.nextSibling);
    hb.insertBefore(searchEl, titleEl.nextSibling);
    titleEl.style.height='44px';
    scrollEl.scrollTop=0;
  }
  document.getElementById('legend').innerHTML=LEGEND[m];
  document.getElementById('badge').textContent =
    m==='before' ? 'scroll ↓ — title clips, pills leave' : 'scroll ↓ — search jumps into the band next to ✕';
}

scrollEl.addEventListener('scroll', ()=>{
  const s=scrollEl.scrollTop;
  if(mode==='before'){
    /* current behavior: collapse the title row height -> text visibly clips */
    titleRowB.style.height=Math.max(0,44-s*1.3)+'px';
  } else {
    /* jump into the ✕ band only once the row's BOTTOM edge has scrolled past the top —
       its slot is already off-screen, so no empty gap is left behind */
    const anchor = pinned ? pinSpacer : searchA;
    setPinned(s >= anchor.offsetTop + anchor.offsetHeight - 42);   /* bottom edge passes under the 42px band */
  }
});

const pinBar=document.getElementById('pinBar'), pinSpacer=document.createElement('div');
let pinned=false;
function setPinned(p){
  if(p===pinned) return;
  pinned=p;
  const focused = searchA.contains(document.activeElement);
  if(p){ pinSpacer.style.height=searchA.offsetHeight+'px'; searchA.replaceWith(pinSpacer); pinBar.appendChild(searchA); }
  else  { pinSpacer.replaceWith(searchA); }
  modal.classList.toggle('pinned', p);
  if(focused) searchA.querySelector('input').focus();
  if(drop.style.display==='block') placeDrop();
}

document.getElementById('segMode').addEventListener('click',e=>{
  if(e.target.dataset.m){ [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));
    setMode(e.target.dataset.m); }
});
document.getElementById('segTheme').addEventListener('click',e=>{
  if(e.target.dataset.t){ [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));
    modal.classList.toggle('light', e.target.dataset.t==='light');
    modal.classList.toggle('dark',  e.target.dataset.t==='dark');
    document.body.classList.toggle('light', e.target.dataset.t==='light'); }
});
document.getElementById('guides').addEventListener('change',e=>{
  modal.classList.toggle('guides', e.target.checked);
  document.getElementById('guideX').style.right = mode==='after' ? '64px' : '33px';
});

const boot = location.hash.includes('after') ? 'after' : 'before';
if(boot==='after') [...document.getElementById('segMode').children].forEach(b=>b.classList.toggle('on',b.dataset.m==='after'));
if(location.hash.includes('light')){ [...document.getElementById('segTheme').children].forEach(b=>b.classList.toggle('on',b.dataset.t==='light'));
  modal.classList.add('light'); modal.classList.remove('dark'); document.body.classList.add('light'); }
setMode(boot);
if(location.hash.includes('scrolled')){ scrollEl.scrollTop=260; scrollEl.dispatchEvent(new Event('scroll')); }
if(location.hash.includes('drop')){ const i=document.querySelector('.scrollInner .srch')||document.querySelector('.srch'); i.value='a'; i.closest('.searchField').classList.add('has'); renderDrop('a'); }
</script>
</body>
